    .w-out { stroke-width: 3.2; } .w-line { stroke-width: 1.6; } .w-hair { stroke-width: 1.0; }
    text { font-family: "Montserrat", sans-serif; }
    .t-id { font-size: 18px; font-weight: 400; }
