<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">FIG-09-01: What a graph records</title>
  <desc id="fig-desc">Five vertices joined by seven edges, the same seven joins drawn as arcs, one weighted edge and one vertex that no edge reaches.</desc>
