<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1048" width="1000" height="1048"
     role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">FIG-09-11: When a piece of the answer is final</title>
  <desc id="fig-desc">Three stacked bands over one five vertex graph, with c ringed and carrying a final chip in each: BFS writes d=2 at the first reach, DFS closes c at finish 7, Dijkstra extracts c at 8. The events differ, the claim does not.</desc>
