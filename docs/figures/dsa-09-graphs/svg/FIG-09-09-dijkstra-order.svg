<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720"
     role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">FIG-09-09: Dijkstra settles in cost order</title>
  <desc id="fig-desc">Dijkstra settles s at 0, b at 2, a at 3, c at 8 and t at 11, because b relaxes the key of a from 4 to 3, so keys only ever fall. One arc of weight -2 leaves a settled 3 above the true cost 2, and finality fails. The drawing prints inf for infinity.</desc>
