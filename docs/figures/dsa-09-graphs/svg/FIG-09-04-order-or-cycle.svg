<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" width="1000" height="940" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">FIG-09-04: Order or cycle</title>
  <desc id="fig-desc">Two views of one five vertex graph. In A the five arcs admit two listings, s b a c t and s a b c t, and both pass all five per arc checks. In B one added arc from t to s closes the loop s a c t s, so no listing survives.</desc>
