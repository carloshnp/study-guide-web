  <title id="fig-title">FIG-09-10: Toposort by prepending</title>
  <desc id="fig-desc">Each vertex is prepended at the left when it finishes, so the list grows there and the last row reads s b a c t; the same visit, meeting an active vertex through the arc t to s, reports the cycle s a c t s and no order.</desc>
