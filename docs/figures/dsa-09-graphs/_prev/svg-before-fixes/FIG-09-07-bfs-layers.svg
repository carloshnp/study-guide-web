<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">FIG-09-07: BFS in layers</title>
  <desc id="fig-desc">The queue holds at most two consecutive layers, and a distance is fixed at enqueue, so the ring marks a value that is already final.</desc>
