version: 1

# Curated list of published guides. Absolute source paths live in
# sources.local.yaml, which is gitignored. Chapter counts are measured by
# pipeline.ingest --all --check and must match expected_chapters exactly.

subjects:
  - {id: metalurgia, title: Metalurgia, order: 1}
  - {id: programacao, title: Programação, order: 2}
  - {id: resistencia-dos-materiais, title: Resistência dos Materiais, order: 3}
  - {id: calculo-numerico, title: Cálculo Numérico, order: 4}

# Subfolders inside a subject. A guide opts in with `group:`; without it the guide
# sits directly under the subject. Ids are unique across the catalog and a group
# must belong to the same subject as the guides it holds.
groups:
  - {id: nao-ferrosos, title: Não-Ferrosos, subject: metalurgia, order: 1}

guides:
  - id: aluminio
    title: Alumínio
    subject: metalurgia
    group: nao-ferrosos
    type: teoria
    split: 2
    expected_chapters: 29
    order: 1
    published: true
    updated: 2026-10-21

  # 16, not 39: the guide was rewritten in the magnesium shape. The 15 theory
  # chapters became 11 (3+4, 7+8, 9+10 and 12+13 merged), the 21 per-question
  # chapters became 3 bank volumes, and quick reference and glossary stayed.
  - id: titanio
    title: Titânio
    subject: metalurgia
    group: nao-ferrosos
    type: teoria
    split: 2
    expected_chapters: 16
    order: 2
    published: true
    updated: 2026-10-22

  # 9, not 16: `split_document` promotes the trailing H1 blocks (banco de
  # questões, referência rápida, glossário) to chapters of their own, so the
  # question and quick-reference sections counted here before are now sections
  # of those three chapters. 6 theory chapters + 3 appendix chapters = 9.
  - id: magnesio
    title: Magnésio
    subject: metalurgia
    group: nao-ferrosos
    type: teoria
    split: 2
    expected_chapters: 9
